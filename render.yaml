services:
  - type: web
    name: quizzzzzz
    env: node
    buildCommand: npm install && npm rebuild sqlite3 --build-from-source
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /var/data/quiz.db
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
